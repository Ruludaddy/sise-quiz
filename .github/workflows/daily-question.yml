name: Daily Question

# 매일 KAMIS 시세로 '오늘의 문제'를 생성해 GitHub Pages(gh-pages 브랜치)에 게시해요.
# 서버 불필요 · 키는 Secrets(DATAGO_SERVICE_KEY)에만 저장돼요.

on:
  schedule:
    # 매일 00:10 KST (UTC 15:10). 하루 시작에 today.json 을 미리 만들어 둬요.
    - cron: '10 15 * * *'
  workflow_dispatch: {} # 콘솔에서 수동 실행 가능
  push:
    branches: [main]
    # 문제 시드/생성 로직을 push 하면 곧바로 재생성·재게시해요. (푸시 → 몇 분 뒤 반영)
    paths:
      - 'daily-service/**'
      - '.github/workflows/daily-question.yml'

permissions:
  contents: write # gh-pages 브랜치 푸시용
  pages: write # Pages 빌드 트리거용

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # daily-service 는 외부 의존성이 없어 설치 단계가 필요 없어요(내장 fetch/fs).
      - name: Generate today's question (KAMIS)
        working-directory: daily-service
        env:
          DAILY_SOURCE: kamis
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}
          # 품목을 바꾸려면 아래 env 를 지정하세요(기본: 서울 양곡도매 쌀 20kg)
          # KAMIS_ITEM_CD: '211'
          # KAMIS_CTGRY_CD: '200'
          # KAMIS_QUESTION: '오늘 배추 1포기 도매가는?'
        run: node generate-daily.mjs

      - name: Generate main question bank (seed + KAMIS live)
        working-directory: daily-service
        env:
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}
          # 실시세로 섞을 KAMIS 프리셋(sources/kamis.mjs PRESETS 키). 콤마로 여러 개.
          KAMIS_BANK_ITEMS: rice
        run: node generate-questions.mjs

      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: daily-service/out
          publish_branch: gh-pages
          keep_files: true # 과거 {date}.json 유지

      # Pages 자동 빌드가 가끔 지연돼서, 명시적으로 빌드를 깨워요.
      - name: Trigger Pages build
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "pages build request: %{http_code}\n"
