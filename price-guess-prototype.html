<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>얼마일까?</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --blue:#3182F6; --blue-dark:#1B64DA; --blue-weak:#E8F1FE;
    --bg:#F2F4F6; --surface:#FFFFFF;
    --text:#191F28; --sub:#6B7684; --weak:#B0B8C1; --line:#EAEDF0;
    --red:#F04452; --green:#15C47E; --yellow:#F5A623; --gold:#B8860B;
    --shadow:0 4px 20px rgba(0,0,0,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#DDE1E6;color:var(--text);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .phone{width:100%;max-width:390px;height:min(92vh,820px);background:var(--surface);border-radius:34px;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;position:relative}
  .nav{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 8px 0 16px;
    border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex:1;min-width:0}
  .logo{width:22px;height:22px;border-radius:7px;background:var(--blue);position:relative;flex:0 0 auto}
  .logo::after{content:"₩";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .nav-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub)}
  .icon-btn:active{background:var(--bg)}
  .content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--bg)}
  .pad{padding:20px 20px 32px}

  /* 홈 */
  .hero{background:linear-gradient(135deg,#3182F6,#1B64DA);border-radius:var(--radius);padding:24px 22px;color:#fff;box-shadow:var(--shadow)}
  .hero .eyebrow{font-size:13px;font-weight:600;opacity:.85}
  .hero h1{font-size:23px;font-weight:800;margin:6px 0 4px;letter-spacing:-.4px}
  .hero p{font-size:14px;opacity:.9;margin-bottom:18px}
  .cta{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:var(--blue);transition:transform .06s}
  .cta:active{transform:scale(.985)}
  .section-label{font-size:13px;font-weight:700;color:var(--sub);margin:26px 4px 12px}
  .card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .06s}
  .card:active{transform:scale(.99)}
  .card.done{opacity:.6}
  .chip{width:52px;height:52px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;background:#FFF6E5}
  .card .meta{flex:1;min-width:0}
  .card .meta .name{font-size:16px;font-weight:700}
  .card .meta .desc{font-size:13px;color:var(--sub);margin-top:2px}
  .badge-new{font-size:11px;font-weight:800;color:#fff;background:var(--yellow);padding:5px 9px;border-radius:999px;white-space:nowrap}
  .badge-done{font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);padding:5px 9px;border-radius:999px;white-space:nowrap}
  .disclaimer{margin-top:22px;font-size:11.5px;color:var(--weak);text-align:center;line-height:1.55;padding:0 6px}

  /* 게임 */
  .game{display:flex;flex-direction:column;height:100%;padding:16px 20px 22px}
  .game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .prog-pill{font-size:12px;font-weight:700;color:var(--sub);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
  .prog-pill.today{color:var(--gold);background:#FFF6E5;border-color:#F0E0B8}
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
  .q-label{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px}
  .q-text{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.35;margin-bottom:6px}
  .q-note{font-size:12.5px;color:var(--sub);margin-bottom:28px}
  .amount{text-align:center;font-size:46px;font-weight:900;letter-spacing:-1.5px;color:var(--text);min-height:56px;margin-bottom:2px}
  .amount.empty{color:var(--weak)}
  .amount-sub{text-align:center;font-size:13px;color:var(--sub);margin-bottom:6px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .key{border:0;background:var(--surface);border-radius:14px;padding:15px 0;font-size:22px;font-weight:700;color:var(--text);box-shadow:var(--shadow);cursor:pointer;transition:transform .05s,background .1s}
  .key:active{transform:scale(.95);background:var(--blue-weak)}
  .key.util{font-size:17px;color:var(--sub);font-weight:600}

  /* 정답 공개 */
  .reveal{background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-top:8px;text-align:center;animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  .reveal .actual{font-size:13px;color:var(--sub)}
  .reveal .actual b{font-size:22px;color:var(--text);display:block;margin-top:3px;font-weight:800}
  .reveal .score{font-size:44px;font-weight:900;margin:12px 0 2px}
  .reveal .fb{font-size:14px;font-weight:700}
  .sc-hi{color:var(--green)} .sc-mid{color:var(--blue)} .sc-lo{color:var(--red)}

  .btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .06s}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
  .btn.gold{background:var(--yellow);color:#fff}
  .foot-btn{margin-top:16px}

  /* 결과 */
  .result{display:flex;flex-direction:column;height:100%;padding:30px 24px 22px;align-items:center;text-align:center}
  .result .cap{font-size:14px;color:var(--sub);margin-top:20px}
  .big-score{font-size:64px;font-weight:900;letter-spacing:-2px;margin:6px 0}
  .result h2{font-size:20px;font-weight:800}
  .recap{width:100%;margin:22px 0 auto;display:flex;flex-direction:column;gap:8px}
  .recap-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .recap-row .rq{font-size:13px;color:var(--text);font-weight:600;flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:10px}
  .recap-row .rs{font-size:15px;font-weight:800}
  .btn-col{width:100%;display:flex;flex-direction:column;gap:10px}

  /* 모달/오버레이 */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
  .sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
  .sheet p{font-size:14px;color:var(--sub);margin-bottom:20px}
  .sheet .row{display:flex;gap:10px}.sheet .row .btn{flex:1}
  .set-item{display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--line)}
  .set-item:last-of-type{border-bottom:0}
  .set-item .label{font-size:15px;font-weight:600}
  .set-item .val{font-size:14px;color:var(--sub)}
  .toggle{width:52px;height:30px;border-radius:999px;background:#D1D6DB;position:relative;cursor:pointer;transition:background .18s;border:0}
  .toggle.on{background:var(--blue)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on::after{left:25px}
  .link-btn{background:none;border:0;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;padding:16px 2px;text-align:left;width:100%}
  .pp-body{font-size:13px;color:var(--sub);line-height:1.7;max-height:50vh;overflow-y:auto;margin-bottom:20px}

  .ad{position:absolute;inset:0;background:#0B0F14;color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .ad .badge{position:absolute;top:16px;left:16px;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:6px}
  .ad .count{position:absolute;top:16px;right:16px;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
  .ad-box{width:120px;height:120px;border-radius:26px;background:linear-gradient(135deg,#3182F6,#15C47E);display:flex;align-items:center;justify-content:center;font-size:48px}

  .toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(25,31,40,.94);color:#fff;font-size:14px;font-weight:600;padding:13px 20px;border-radius:14px;z-index:50;animation:tin .2s ease;max-width:90%}
  @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
  <div class="phone">
    <div class="nav">
      <div class="brand"><div class="logo"></div><span class="nav-title" id="navTitle">얼마일까?</span></div>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btnClose" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="content" id="content"></div>
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
  </div>

<script>
/* =========================================================
   얼마일까? — 가격 맞히기 (앱인토스 프로토타입)
   * [TOSS] 주석: 실서비스(React+SDK) 이식 포인트
   * ⚠️ 아래 가격은 시연용 예시값. 실서비스는 검증된/공공데이터
   *    최신 시세로 교체해야 함 (지침 2-5).
   ========================================================= */

// ---- 고정 문제 풀 (상식형 텍스트, 자체 제작 · 예시값) ----
const POOL = [
  {q:'서울 지하철 기본요금 (교통카드)', a:1400, min:500, max:3000, diff:1},
  {q:'편의점 생수 500ml 1병', a:1000, min:300, max:3000, diff:1},
  {q:'로또 복권 1장', a:1000, min:500, max:5000, diff:1},
  {q:'서울 시내버스 기본요금 (카드)', a:1500, min:500, max:3000, diff:1},
  {q:'분식집 김밥 한 줄 (기본)', a:3500, min:1500, max:7000, diff:2},
  {q:'스타벅스 아메리카노 (톨, 국내)', a:4500, min:2000, max:8000, diff:2},
  {q:'맥도날드 빅맥 단품 (한국)', a:5500, min:3000, max:9000, diff:2},
  {q:'서울 중형택시 기본요금 (주간)', a:4800, min:2000, max:9000, diff:2},
  {q:'영화관 일반 2D 성인 (주중)', a:14000, min:8000, max:22000, diff:3},
  {q:'넷플릭스 광고형 스탠다드 월요금', a:5500, min:3000, max:20000, diff:3},
  {q:'치킨 프랜차이즈 후라이드 한 마리', a:20000, min:12000, max:30000, diff:3},
  {q:'서울 성인 목욕탕 입욕료 (평일)', a:9000, min:4000, max:16000, diff:3},
];
// ---- 오늘의 문제 (보너스, 공공데이터 시세 컨셉 · 예시값) ----
// [TOSS] 실서비스: 공공데이터 API(예: 농수산물 도매가)에서 매일 1문제 생성
const TODAY = {q:'오늘 가락시장 배추 1포기 도매가', a:3200, min:500, max:8000,
  note:'공공데이터 시세 연동 예정 (현재 예시값)'};

// ---- 상태 ([TOSS] todayDone/최고기록은 Storage+날짜키로 영속화: 지침 5-6) ----
let soundOn=true, todayDone=false;
let mode='main';            // 'main' | 'today'
let qList=[], qIdx=0, scores=[];
let activeTimers=[];

const $=id=>document.getElementById(id);
const content=$('content');
const won=(n)=>'₩'+Math.round(n).toLocaleString('ko-KR');

function setT(fn,ms){const id=setTimeout(fn,ms);activeTimers.push(id);return id;}
function clearTimers(){activeTimers.forEach(clearTimeout);activeTimers=[];}

// ---- 사운드 (지침 5-3) ----
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); }
function beep(f,d=0.09,t='sine',v=0.14){ if(!soundOn||!audioCtx||audioCtx.state!=='running')return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
  const n=audioCtx.currentTime;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d+0.02); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&audioCtx)audioCtx.suspend(); else if(!document.hidden&&audioCtx&&soundOn)audioCtx.resume(); });

function setNavTitle(t){$('navTitle').textContent=t;}
function scoreOf(guess,actual){ const err=Math.abs(guess-actual)/actual; return Math.max(0,Math.round(100-err*100)); }
function fbOf(s){ return s>=95?['시세 도사!','sc-hi'] : s>=80?['감각 좋아요','sc-hi'] : s>=60?['그럭저럭','sc-mid'] : ['다시 감 잡아봐요','sc-lo']; }

// =================== 홈 ===================
function renderHome(){
  clearTimers(); setNavTitle('얼마일까?');
  content.innerHTML=`
    <div class="pad">
      <div class="hero">
        <div class="eyebrow">가격 감각 테스트</div>
        <h1>이거, 얼마일까요?</h1>
        <p>정답에 가까울수록 높은 점수! 한 판 5문제</p>
        <button class="cta" id="ctaStart">가격 맞히기 시작하기</button>
      </div>

      <div class="section-label">보너스</div>
      <div class="card ${todayDone?'done':''}" id="todayCard">
        <div class="chip">📈</div>
        <div class="meta">
          <div class="name">오늘의 문제</div>
          <div class="desc">${todayDone?'내일 새 문제로 만나요':'매일 바뀌는 시세 한 문제'}</div>
        </div>
        ${todayDone?'<span class="badge-done">완료</span>':'<span class="badge-new">NEW</span>'}
      </div>

      <div class="disclaimer">
        실제 가격은 시점·지역·판매처에 따라 달라질 수 있어요.<br/>
        재미로 즐기는 콘텐츠이며, 어떤 현금·상품 보상과도 연결되지 않아요.
      </div>
    </div>`;
  $('ctaStart').onclick=()=>{ ensureAudio(); startMain(); };
  $('todayCard').onclick=()=>{ ensureAudio(); if(todayDone){ showToast('오늘의 문제는 내일 다시 열려요'); return; } startToday(); };
}

// =================== 라운드 시작 ===================
function pick5(){
  // 난이도 easy→hard로 정렬해 한 판 안에서 점점 어려워지게 (지침 취지: 상승 난이도)
  const shuffled=[...POOL].sort(()=>Math.random()-0.5);
  const byDiff=[...shuffled].sort((a,b)=>a.diff-b.diff);
  const easy=byDiff.filter(x=>x.diff===1), mid=byDiff.filter(x=>x.diff===2), hard=byDiff.filter(x=>x.diff===3);
  const r=arr=>arr[Math.floor(Math.random()*arr.length)];
  const set=[r(easy),r(easy),r(mid),r(mid),r(hard)];
  // 중복 제거 보정
  const seen=new Set(), out=[];
  for(const it of set){ if(!seen.has(it.q)){seen.add(it.q);out.push(it);} }
  while(out.length<5){ const c=r(shuffled); if(!seen.has(c.q)){seen.add(c.q);out.push(c);} }
  return out;
}
function startMain(){ mode='main'; qList=pick5(); qIdx=0; scores=[]; renderQuestion(); }
function startToday(){ mode='today'; qList=[TODAY]; qIdx=0; scores=[]; renderQuestion(); }

// =================== 문제 화면 ===================
function renderQuestion(){
  clearTimers();
  const item=qList[qIdx];
  const isToday=mode==='today';
  setNavTitle(isToday?'오늘의 문제':'가격 맞히기');
  let typed='';
  content.innerHTML=`
    <div class="game">
      <div class="game-top">
        <span></span>
        <span class="prog-pill ${isToday?'today':''}">${isToday?'보너스 · 오늘의 문제':(qIdx+1)+' / '+qList.length}</span>
      </div>
      <div class="qwrap">
        <div class="q-label">${isToday?'📈 오늘의 시세':'Q'+(qIdx+1)+'. 가격을 맞혀보세요'}</div>
        <div class="q-text">${item.q}</div>
        <div class="q-note">${item.note?item.note:'예상 가격을 직접 입력해보세요'}</div>
        <div class="amount empty" id="amount">₩0</div>
        <div class="amount-sub">예상 가격</div>
        <div id="revealSlot"></div>
      </div>
      <div class="keypad" id="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
        <button class="key util" data-k="000">000</button>
        <button class="key" data-k="0">0</button>
        <button class="key util" data-k="del">⌫</button>
      </div>
      <button class="btn primary foot-btn" id="btnCheck" disabled style="opacity:.5">정답 확인</button>
    </div>`;

  const amountEl=$('amount'), checkBtn=$('btnCheck');
  const refresh=()=>{
    const v = typed==='' ? 0 : parseInt(typed,10);
    amountEl.textContent = won(v);
    amountEl.classList.toggle('empty', typed==='');
    const ok = typed!=='' && v>0;
    checkBtn.disabled=!ok; checkBtn.style.opacity=ok?'1':'.5';
  };
  $('keypad').querySelectorAll('.key').forEach(k=>{
    k.onclick=()=>{
      const key=k.dataset.k;
      if(key==='del'){ typed=typed.slice(0,-1); }
      else if(key==='000'){ if(typed!=='' && typed!=='0' && typed.length<=6) typed+='000'; }
      else { if(typed.length<8){ typed=(typed==='0'?'':typed)+key; } }
      beep(360,0.035,'sine',0.07);
      refresh();
    };
  });
  refresh();
  checkBtn.onclick=()=>{ const v=parseInt(typed||'0',10); if(v>0) reveal(item, v); };
}

function reveal(item, guess){
  const kp=$('keypad'); if(kp) kp.style.display='none';
  const s=scoreOf(guess,item.a); scores.push(s);
  const [txt,cls]=fbOf(s);
  s>=80?beep(720,0.12,'triangle',0.15):s>=60?beep(520,0.1,'sine',0.13):beep(200,0.2,'sawtooth',0.14);
  $('revealSlot').innerHTML=`
    <div class="reveal">
      <div class="actual">실제 가격<b>${won(item.a)}</b></div>
      <div class="score ${cls}">${s}점</div>
      <div class="fb ${cls}">${txt} · 내 예상 ${won(guess)}</div>
    </div>`;
  const btn=$('btnCheck');
  const last=(qIdx>=qList.length-1);
  btn.textContent = mode==='today' ? '결과 보기' : (last?'결과 보기':'다음 문제');
  btn.onclick=()=>{ if(mode==='today'||last){ finishRun(); } else { qIdx++; renderQuestion(); } };
}

// =================== 결과 ===================
function finishRun(){
  clearTimers();
  if(mode==='today'){ todayDone=true; /* [TOSS] Storage에 오늘 날짜로 완료 표시 */ }
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const [txt,cls]=fbOf(avg);
  setNavTitle('결과');
  const recap = qList.map((it,i)=>`
    <div class="recap-row"><span class="rq">${it.q}</span><span class="rs ${fbOf(scores[i])[1]}">${scores[i]}점</span></div>`).join('');
  content.innerHTML=`
    <div class="result">
      <div class="cap">${mode==='today'?'오늘의 문제 결과':'이번 판 시세 감각'}</div>
      <div class="big-score ${cls}">${avg}<span style="font-size:26px">점</span></div>
      <h2 class="${cls}">${txt}</h2>
      <div class="recap">${recap}</div>
      <div class="btn-col" id="resBtns"></div>
      <div class="disclaimer" style="margin-top:14px">가격은 시점에 따라 달라질 수 있어요 · 재미로 즐기는 콘텐츠</div>
    </div>`;
  const box=$('resBtns');
  if(mode==='today'){
    box.innerHTML=`<button class="btn primary" id="bMain">가격 맞히기 한 판 더</button>
                   <button class="btn ghost" id="bHome">홈으로</button>`;
    $('bMain').onclick=startMain;
  }else{
    box.innerHTML=`<button class="btn primary" id="bAgain">한 판 더</button>
                   ${todayDone?'':'<button class="btn gold" id="bToday">오늘의 문제 풀기</button>'}
                   <button class="btn ghost" id="bHome">홈으로</button>`;
    $('bAgain').onclick=startMain;
    if(!todayDone) $('bToday').onclick=startToday;
  }
  $('bHome').onclick=renderHome;
}

// =================== 모달 ===================
function closeModal(){$('modalRoot').innerHTML='';}
function exitConfirm(){
  const inGame = content.querySelector('.game')||content.querySelector('.result');
  $('modalRoot').innerHTML=`
    <div class="overlay"><div class="sheet">
      <h3>미니앱을 종료할까요?</h3>
      <p>${inGame?'진행 중인 판이 사라져요. ':''}홈으로 돌아가려면 계속하기를 눌러주세요.</p>
      <div class="row">
        <button class="btn ghost" id="mKeep">계속하기</button>
        <button class="btn primary" id="mExit">종료</button>
      </div>
    </div></div>`;
  $('mKeep').onclick=closeModal;
  $('mExit').onclick=()=>{ closeModal(); showToast('미니앱을 종료합니다 (프로토타입)'); renderHome(); };
}
function openSettings(){
  $('modalRoot').innerHTML=`
    <div class="overlay"><div class="sheet">
      <h3>설정</h3><p style="margin-bottom:8px">소리와 정보를 관리해요.</p>
      <div class="set-item"><span class="label">사운드</span><button class="toggle ${soundOn?'on':''}" id="sndToggle"></button></div>
      <button class="link-btn" id="ppBtn">개인정보처리방침</button>
      <div class="set-item"><span class="label">버전</span><span class="val">0.1.0 (proto)</span></div>
      <div style="font-size:11.5px;color:var(--weak);line-height:1.6;margin:14px 2px 20px">
        가격 감각을 겨루는 오락 퀴즈입니다. 표시 가격은 시점·지역에 따라 다를 수 있으며 참고용입니다.
      </div>
      <button class="btn primary" id="setDone">완료</button>
    </div></div>`;
  const tg=$('sndToggle');
  tg.onclick=()=>{ soundOn=!soundOn; tg.classList.toggle('on',soundOn); if(soundOn){ensureAudio();beep(600,0.08);} };
  $('ppBtn').onclick=openPrivacy; $('setDone').onclick=closeModal;
}
function openPrivacy(){
  $('modalRoot').innerHTML=`
    <div class="overlay"><div class="sheet">
      <h3>개인정보처리방침</h3>
      <div class="pp-body">
        · 수집 항목: 사용자 식별키, 플레이 기록(점수·오늘의 문제 완료 여부).<br/>
        · 수집 목적: 진행도 저장 및 콘텐츠 제공.<br/>
        · 보관 기간: 서비스 이용 종료 또는 삭제 요청 시까지.<br/>
        · 점수·가격 데이터는 건강·의료 정보가 아니며 오락 목적으로만 활용됩니다.<br/>
        · 문의: 앱 정보 내 고객센터 채널로 접수해주세요.<br/><br/>
        (프로토타입 문안 — 실서비스 배포 전 최종 검토 필요)
      </div>
      <button class="btn primary" id="ppDone">확인</button>
    </div></div>`;
  $('ppDone').onclick=openSettings;
}
function showToast(m){ const t=document.createElement('div');t.className='toast';t.textContent=m;$('toastRoot').appendChild(t);setTimeout(()=>t.remove(),1800); }

$('btnClose').onclick=exitConfirm;
$('btnSettings').onclick=()=>{ ensureAudio(); openSettings(); };
renderHome();
</script>
</body>
</html>
